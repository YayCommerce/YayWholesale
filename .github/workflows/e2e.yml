name: E2E Tests

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  e2e-single:
    name: E2E – Single Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.COMPOSER_TOKEN }}"}}'

      - name: Install Playwright browsers
        run: pnpm test:e2e:install

      - name: Cache wp-env downloads
        uses: actions/cache@v4
        with:
          path: /home/runner/wp-env
          key: wp-env-${{ hashFiles('tests/e2e/.wp-env.single.json') }}
          restore-keys: |
            wp-env-

      - name: Start wp-env
        run: pnpm env:start:single
        env:
          WP_ENV_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run E2E tests (single-site)
        run: pnpm test:e2e:single

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-single
          path: |
            tests/e2e/test-results/
            tests/e2e/playwright-report/
          retention-days: 7
