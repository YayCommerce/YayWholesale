name: E2E Tests

on:
  workflow_dispatch: # disabled until e2e tests are complete; re-enable push/pull_request triggers when ready

jobs:
  e2e-single:
    name: E2E – Single Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10.15.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm test:e2e:install

      - name: Start wp-env
        run: pnpm env:start:single

      - name: Run E2E tests (single-site)
        run: pnpm test:e2e:single

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-single
          path: tests/e2e/test-results/
          retention-days: 7

  e2e-multisite:
    name: E2E – Multisite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10.15.0'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm test:e2e:install

      - name: Start wp-env
        run: pnpm env:start:multi

      - name: Run E2E tests (multisite)
        run: pnpm test:e2e:multi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-multisite
          path: tests/e2e/test-results/
          retention-days: 7
